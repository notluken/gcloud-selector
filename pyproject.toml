[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcloud-selector"
version = "1.0.1"
description = "Interactive CLI for connecting to GCP VMs via IAP tunnel"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["gcloud", "gcp", "ssh", "iap", "cli", "vm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

dependencies = [
    "simple-term-menu>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.scripts]
gcloud-selector = "gcloud_selector.cli:main"
gcs = "gcloud_selector.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/gcloud-selector"
Documentation = "https://github.com/yourusername/gcloud-selector#readme"
Repository = "https://github.com/yourusername/gcloud-selector"
Issues = "https://github.com/yourusername/gcloud-selector/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gcloud_selector*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=gcloud_selector"
